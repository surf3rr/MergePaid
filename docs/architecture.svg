<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title description">
<title id="title">MergePaid implementation architecture</title>
<desc id="description">A React and Vite browser calls a Node.js API, which optionally imports public GitHub data and stores reviews in memory. The API uses ethers and server-managed demo signers with an in-process Ganache EVM. Solidity is compiled by solc. FundingRound contracts hold funds, cap matching, finalize allocations, and transfer one-time rewards. No personal wallet, persistent database, AI, or external blockchain is connected.</desc>
