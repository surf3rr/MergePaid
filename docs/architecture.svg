<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1020" viewBox="0 0 920 1020" role="img" aria-labelledby="title desc"><title id="title">MergePaid application architecture</title><desc id="desc">A single vertical chain from the React dashboard through Node.js, ethers.js and the local funding contract to the contributor wallet.</desc><rect width="920" height="1020" fill="white"/>
<text x="40" y="64" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#193b34">MergePaid application architecture</text>
<rect x="40" y="98" width="840" height="134" rx="12" fill="#f2f7f4" stroke="#709487" stroke-width="2"/><g transform="translate(65 120)" fill="none" stroke="#216451" stroke-width="2.5" stroke-linejoin="round"><rect x="1" y="4" width="35" height="26" rx="3"/><path d="M1 12h35M7 8h2m3 0h2"/></g>
<text x="124" y="142" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#193b34">React dashboard</text>
<text x="124" y="178" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">Maintainers, sponsors and contributors use the Vite-served interface</text>
<text x="124" y="205" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">to open rounds, sponsor projects, review pull requests and claim rewards.</text>
<path d="M460 233v42" stroke="#216451" stroke-width="3"/><path d="M453 273h14l-7 9z" fill="#216451"/>
<text x="478" y="261" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#34584d">JSON requests through /api</text>
<rect x="40" y="283" width="840" height="134" rx="12" fill="#f2f7f4" stroke="#709487" stroke-width="2"/><g transform="translate(65 305)" fill="none" stroke="#216451" stroke-width="2.5" stroke-linejoin="round"><path d="M18 1l15 9v18l-15 9-15-9V10z"/><path d="M12 26V12l12 14V12"/></g>
<text x="124" y="327" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#193b34">Node.js application server</text>
<text x="124" y="363" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">Loads sample or public GitHub pull requests. Keeps reviews and appeals</text>
<text x="124" y="390" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">in memory. Once review is complete, calculates shares and hashes the evidence.</text>
<path d="M460 418v42" stroke="#216451" stroke-width="3"/><path d="M453 458h14l-7 9z" fill="#216451"/>
<text x="478" y="446" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#34584d">Contract calls and allocation data</text>
<rect x="40" y="468" width="840" height="134" rx="12" fill="#f2f7f4" stroke="#709487" stroke-width="2"/><g transform="translate(65 490)" fill="none" stroke="#216451" stroke-width="2.5" stroke-linejoin="round"><path d="M1 12h30m-7-7 7 7-7 7M35 26H5m7-7-7 7 7 7"/></g>
<text x="124" y="512" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#193b34">ethers.js transaction layer</text>
<text x="124" y="548" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">Uses server-managed demo signers to submit each role’s transactions.</text>
<text x="124" y="575" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">Uses the ABI and bytecode compiled by solc to deploy each round.</text>
<path d="M460 603v42" stroke="#216451" stroke-width="3"/><path d="M453 643h14l-7 9z" fill="#216451"/>
<text x="478" y="631" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#34584d">Signed transactions via the in-process provider</text>
<rect x="40" y="653" width="840" height="134" rx="12" fill="#f2f7f4" stroke="#709487" stroke-width="2"/><g transform="translate(65 675)" fill="none" stroke="#216451" stroke-width="2.5" stroke-linejoin="round"><path d="M18 1l15 8v18l-15 9-15-9V9zM3 9l15 9 15-9M18 18v18"/></g>
<text x="124" y="697" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#193b34">FundingRound on Ganache</text>
<text x="124" y="733" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">One Solidity contract per round holds local ETH, caps sponsor matching</text>
<text x="124" y="760" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">and checks that final allocations add up to the funded pool.</text>
<path d="M460 788v42" stroke="#216451" stroke-width="3"/><path d="M453 828h14l-7 9z" fill="#216451"/>
<text x="478" y="816" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#34584d">Successful claim transfers local ETH</text>
<rect x="40" y="838" width="840" height="134" rx="12" fill="#f2f7f4" stroke="#709487" stroke-width="2"/><g transform="translate(65 860)" fill="none" stroke="#216451" stroke-width="2.5" stroke-linejoin="round"><rect x="1" y="7" width="34" height="25" rx="4"/><path d="M2 9l24-7v5m8 9H23v9h11"/><circle cx="27" cy="20" r="1"/></g>
<text x="124" y="882" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#193b34">Contributor wallet and receipt</text>
<text x="124" y="918" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">The contributor’s demo wallet receives the payment. The contract clears</text>
<text x="124" y="945" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#193b34">the claim balance, and the dashboard shows the transaction receipt.</text>
</svg>