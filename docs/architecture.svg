<rect x="70" y="955" width="1060" height="86" rx="10" fill="#ffffff" stroke="#dfe7d6"/>
<text x="90" y="980" class="label">TRUST BOUNDARY</text>
<text x="90" y="1002" class="body">The API enforces reviews and appeals. The contract trusts the reviewer; it enforces funds, matching caps, and claims.</text>
<text x="90" y="1023" class="small">No connected AI, personal wallet, or production authentication. All application and chain state resets when the server restarts.</text>
<path d="M75 1070H113" class="line"/><text x="125" y="1074" class="small">Runtime call or data flow</text>
<path d="M350 1070H388" class="build"/><text x="400" y="1074" class="small">Compilation artifact</text>
<text x="805" y="1074" class="small">Matched to the implemented source code</text>
