<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060" role="img" aria-labelledby="title desc"><title id="title">MergePaid application workflow</title><desc id="desc">A sequence diagram following one funding round from deployment to contributor payment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#31524c"/></marker></defs><rect width="1100" height="1060" fill="white"/>
<text x="40" y="52" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#193832" text-anchor="start">MergePaid application workflow</text>
<text x="40" y="86" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#193832" text-anchor="start">One funding round, from repository selection to a contributor’s local ETH payment.</text>
<rect x="92" y="115" width="288" height="71" rx="9" fill="#eaf2ee"/>
<text x="236" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#193832" text-anchor="middle">User interface</text>
<text x="236" y="171" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#193832" text-anchor="middle">React · Vite</text>
<line x1="236" y1="186" x2="236" y2="975" stroke="#9cb0a8" stroke-width="1.5" stroke-dasharray="5 6"/>
<rect x="452" y="115" width="288" height="71" rx="9" fill="#eaf2ee"/>
<text x="596" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#193832" text-anchor="middle">Application server</text>
<text x="596" y="171" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#193832" text-anchor="middle">Node.js · in-memory reviews</text>
<line x1="596" y1="186" x2="596" y2="975" stroke="#9cb0a8" stroke-width="1.5" stroke-dasharray="5 6"/>
<rect x="794" y="115" width="288" height="71" rx="9" fill="#eaf2ee"/>
<text x="938" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#193832" text-anchor="middle">Local blockchain</text>
<text x="938" y="171" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#193832" text-anchor="middle">Ganache · FundingRound.sol</text>
<line x1="938" y1="186" x2="938" y2="975" stroke="#9cb0a8" stroke-width="1.5" stroke-dasharray="5 6"/>
<rect x="17" y="203" width="167" height="29" rx="5" fill="#194d42"/>
<text x="29" y="223" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="start">1   Open round</text>
<text x="416.0" y="239" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Maintainer selects repository</text>
<line x1="236" y1="248" x2="596" y2="248" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="767.0" y="278" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Deploy round with matching reserve</text>
<line x1="596" y1="287" x2="938" y2="287" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="17" y="313" width="167" height="29" rx="5" fill="#194d42"/>
<text x="29" y="333" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="start">2   Fund &amp; import</text>
<text x="416.0" y="344" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Sponsor deposits local ETH</text>
<line x1="236" y1="353" x2="596" y2="353" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="767.0" y="385" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Submit deposit via ethers signer</text>
<line x1="596" y1="394" x2="938" y2="394" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="675" y="403" width="408" height="31" rx="5" fill="#fff3d6"/>
<text x="879.0" y="424" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#193832" text-anchor="middle">Contract matches up to the remaining reserve.</text>
<rect x="286" y="440" width="620" height="31" rx="5" fill="#fff3d6"/>
<text x="596.0" y="461" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#193832" text-anchor="middle">API loads sample PRs or imports merged PRs from the public GitHub API.</text>
<rect x="17" y="487" width="167" height="29" rx="5" fill="#194d42"/>
<text x="29" y="507" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="start">3   Review</text>
<text x="416.0" y="522" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Maintainer opens review</text>
<line x1="236" y1="531" x2="596" y2="531" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="767.0" y="560" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Close funding and enter review</text>
<line x1="596" y1="569" x2="938" y2="569" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="416.0" y="604" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Score PRs and assign demo wallets</text>
<line x1="236" y1="613" x2="596" y2="613" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270" y="627" width="660" height="31" rx="5" fill="#fff3d6"/>
<text x="600.0" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#193832" text-anchor="middle">Contributors may appeal. The maintainer records a decision and any score change.</text>
<rect x="17" y="683" width="167" height="29" rx="5" fill="#194d42"/>
<text x="29" y="703" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="start">4   Finalize</text>
<rect x="253" y="681" width="802" height="31" rx="5" fill="#fff3d6"/>
<text x="654.0" y="702" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#193832" text-anchor="middle">API requires reviewed and assigned PRs, no open appeals and a positive total score.</text>
<rect x="254" y="720" width="802" height="31" rx="5" fill="#fff3d6"/>
<text x="655.0" y="741" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#193832" text-anchor="middle">API splits the funded pool by score in integer wei and hashes the review evidence.</text>
<text x="767.0" y="781" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Submit allocations and evidence hash</text>
<line x1="596" y1="790" x2="938" y2="790" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="611" y="806" width="472" height="31" rx="5" fill="#fff3d6"/>
<text x="847.0" y="827" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#193832" text-anchor="middle">Contract checks the reviewer and exact pool total.</text>
<rect x="17" y="859" width="167" height="29" rx="5" fill="#194d42"/>
<text x="29" y="879" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="start">5   Claim</text>
<text x="416.0" y="886" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Contributor requests reward</text>
<line x1="236" y1="895" x2="596" y2="895" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="767.0" y="924" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Call claim() as contributor</text>
<line x1="596" y1="933" x2="938" y2="933" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="767.0" y="967" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Confirm transfer to contributor wallet</text>
<line x1="938" y1="976" x2="596" y2="976" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="416.0" y="1003" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#193832" text-anchor="middle">Return transaction receipt</text>
<line x1="596" y1="1012" x2="236" y2="1012" stroke="#31524c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="1045" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#193832" text-anchor="start">Read from top to bottom. The server manages demo signers. Review records and the local chain reset on restart.</text>
</svg>